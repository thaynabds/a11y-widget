spring.application.name=a11y-widget-api

# H2 in-memory (no external DB required for demo / free deploy)
spring.datasource.url=jdbc:h2:mem:a11ydb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false

# JWT — override via environment variable in production (never hardcode in source)
jwt.secret=${JWT_SECRET:0aQ3r8zX1mL5pK9wE2yN7vB4tG6uD0aQ3r8zX1mL5pK9wE2yN7vB4tG6uD00a}
jwt.expiration-ms=86400000

# CORS — restrict to your frontend domains in production
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,https://thaynabds.github.io}

# OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

server.port=${PORT:8080}
