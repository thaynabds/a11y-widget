services:
  a11y-api:
    type: web
    env: java
    buildCommand: "./mvnw clean package -DskipTests"
    startCommand: "java -jar target/a11y-api-1.0.0.jar"
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://thaynabds.github.io"
      - key: PORT
        value: "8080"
